name: Daily video

on:
  schedule:
    - cron: '30 4 * * *'        # 04:30 UTC = 10:00 IST: builds and schedules today's 18:30 IST video
  workflow_dispatch:            # "Run workflow" button for manual/test runs
    inputs:
      no_upload:
        description: 'Build only, do not upload (download the video from the run page)'
        type: boolean
        default: false
      format:
        description: 'Force a format (blank = auto): explainer, you_didnt_know, top_list, mistakes, story_case_study, how_they_make_money, myth_busting, money_moves'
        required: false
        default: ''
      minutes:
        description: 'Force a length in minutes (blank = auto)'
        required: false
        default: ''

permissions:
  contents: write               # lets the bot save data/history.json back to the repo

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Claude Code (only used if you set CLAUDE_CODE_OAUTH_TOKEN = your Claude subscription)
        env:
          HAS_SUB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: if [ "$HAS_SUB" = "true" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Restore footage/photo cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            ~/.u2net
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      - name: Prepare credentials
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/ci_prepare.py

      - name: Research, make and schedule today's video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          RENDER_WORKERS: '4'
          IN_NO_UPLOAD: ${{ inputs.no_upload }}
          IN_FORMAT: ${{ inputs.format }}
          IN_MINUTES: ${{ inputs.minutes }}
        run: |
          ARGS=""
          if [ "$IN_NO_UPLOAD" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          if [ -n "$IN_FORMAT" ]; then ARGS="$ARGS --format $IN_FORMAT"; fi
          if [ -n "$IN_MINUTES" ]; then ARGS="$ARGS --minutes $IN_MINUTES"; fi
          python run_daily.py $ARGS

      - name: Save channel history to the repo
        if: always()
        run: |
          git config user.name "yt-engine-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history.json data/channel_ids.json 2>/dev/null || true
          git commit -m "history update $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Keep the video + files for 7 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            runs/*/final.mp4
            runs/*/thumbnail_*.jpg
            runs/*/metadata.json
            runs/*/pinned_comment.txt
            runs/*/research_brief.json
            runs/*/run.log
          retention-days: 7
          if-no-files-found: ignore
